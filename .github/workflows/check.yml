name: check

# Manual only for now; add `push:` and `pull_request:` to turn it on.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -k check

  # The SDL build, outside check: the PC build with its tests and smoke test,
  # then the Onion cross build (docker is on GitHub's runners).
  sdl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y libsdl1.2-dev libsdl-ttf2.0-dev libsdl-image1.2-dev
      - run: make sdl
      - uses: actions/upload-artifact@v4
        with:
          name: alttpr-pc
          path: tests/rando/build/sdl/alttpr

  # The Miyoo release, outside check: the zip from Onion's toolchain, then the
  # cross-built generator on the e2e cases under qemu-arm.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y qemu-user
      - run: make package
      - run: make e2e-arm
      - uses: actions/upload-artifact@v4
        with:
          name: alttpr-miyoo
          path: tests/rando/build/package/ALttPR.zip
