[screen]
colour = #14161a
image = background.png
cut = text:~

[font.mono]
file = DejaVuSansMono.ttf
size = fit
cell = 16 32
anchor = top

[tabs]
font = mono
y = 0
right = 640
colour = #ffffff
active_colour = #ffffff
active_before = text:[
active_after = text:]
marker_y = 0

[tabs.band]
x = 0
y = 0
w = 640
h = 32
colour = #22262e
top_line = 0
bottom_line = 0
line_colour = #22262e

; tab.2's x values assume the English tab name "Generate" (8 characters).
[tab.1]
x = 16
active_x = 16
marker_x = 0

[tab.2]
x = 192
active_x = 192
marker_x = 176

[title]
font = mono
x = 16
y = 32
right = 624
colour = #7fb4ff
alert_colour = #7fb4ff

[list]
font = mono
top = 64
bottom = 416
row_height = 32
text_y = 0
label_x = 16
label_x_cursor = 16
right = 624
value_right = 592
value_max = 544
label_gap = 16
arrow_left_gap = 16
arrow_right_gap = 16
label_colour = #e6e6e6
value_colour = #e6e6e6
text_colour = #b8bcc4
disabled_colour = #6b7078
selected_colour = #ffffff
selected_disabled_colour = #8a9099
cursor = none
cursor_disabled = none
arrow_left = text:<
arrow_right = text:>
scroll_up = text:^
scroll_down = text:v
cursor_x = 0
scroll_x = 624
cursor_y = 0
arrow_y = 0
scroll_y = 0

[list.selected]
x = 0
y = 0
w = 640
h = 32
colour = #2f6fd6
top_line = 0
bottom_line = 0
line_colour = #2f6fd6

[list.selected_disabled]
x = 0
y = 0
w = 640
h = 32
colour = #3a3f48
top_line = 0
bottom_line = 0
line_colour = #3a3f48

[notice]
font = mono
x = 16
emphasis_x = 16
right = 624
top = 64
row_height = 32
text_y = 0
colour = #b8bcc4
emphasis_colour = #b8bcc4

[message]
font = mono
x = 16
y = 416
right = 624
info_colour = #9ad0ff
error_colour = #ff6b6b

[footer]
font = mono
x = 16
y = 448
key_y = 448
right = 624
key_gap = 16
hint_gap = 32
label_colour = #9aa0a8
primary_colour = #9aa0a8
button.left_right = hint_text
button.a = hint_text
button.b = hint_text
button.x = hint_text
button.y = hint_text
button.start = hint_text

[footer.band]
x = 0
y = 448
w = 640
h = 32
colour = #22262e
top_line = 0
bottom_line = 0
line_colour = #22262e
